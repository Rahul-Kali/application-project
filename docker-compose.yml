services:
  postgres:
    image: postgres:16-alpine
    container_name: microservices-postgres
    environment:
      POSTGRES_DB: microservices_db
      POSTGRES_USER: microservices_user
      POSTGRES_PASSWORD: microservices_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microservices_user -d microservices_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build: ./user-service
    ports:
      - "8081:8081"

  product-service:
    build: ./product-service
    ports:
      - "8082:8082"

  order-service:
    build: ./order-service
    ports:
      - "8083:8083"
    depends_on:
      - user-service
      - product-service
      - payment-service
      - notification-service
      - analytics-service

  payment-service:
    build: ./payment-service
    ports:
      - "5001:5001"

  notification-service:
    build: ./notification-service
    ports:
      - "5002:5002"

  analytics-service:
    build: ./analytics-service
    ports:
      - "5003:5003"

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - order-service

volumes:
  postgres-data:
